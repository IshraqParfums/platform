<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Collection · Ishraq Parfums</title>
<meta name="description" content="Slide through the collection — every bottle sprays as it arrives.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ---- page shell (demo only — the slider itself is self-contained) ---- */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{background:#241510;}
#collection{min-height:100vh;}

/* ---- slider ---- */
/* ==========================================================================
   Perfume spray slider
   Everything is scoped under .ipx-slider so it can drop into any page.
   Palette follows the Ishraq Parfums house theme: deep espresso ground,
   parchment type, rose + gold accents.
   ========================================================================== */

/* Registering these lets the stage wash crossfade between perfumes.
   Browsers without @property just snap to the new colour. */
@property --ipx-accent {
  syntax: "<color>";
  inherits: true;
  initial-value: #c9963e;
}
@property --ipx-aura {
  syntax: "<color>";
  inherits: true;
  initial-value: #5a2e12;
}

.ipx-slider {
  --ipx-ink: #2c1b14;
  --ipx-ink-2: #3d2519;
  --ipx-cream: #f6ecdc;
  --ipx-cream-dim: rgba(246, 236, 220, 0.62);
  --ipx-line: rgba(246, 236, 220, 0.14);
  --ipx-accent: #c9963e;
  --ipx-accent-soft: #e0bd84;
  --ipx-aura: #5a2e12;

  /* Bottle height drives the label's type scale as well as the SVG. */
  --ipx-bottle-h: clamp(250px, 42vh, 390px);

  --ipx-serif: "Fraunces", ui-serif, Georgia, "Times New Roman", serif;
  --ipx-sans: "Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --ipx-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  position: relative;
  isolation: isolate;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: clamp(8px, 2vh, 20px);
  padding: clamp(20px, 4vh, 44px) clamp(16px, 4vw, 48px) clamp(18px, 3vh, 34px);
  min-height: 640px;
  background:
    radial-gradient(120% 80% at 50% -10%, #4a2c1c 0%, transparent 60%),
    linear-gradient(180deg, var(--ipx-ink) 0%, var(--ipx-ink-2) 55%, #241510 100%);
  color: var(--ipx-cream);
  font-family: var(--ipx-sans);
  -webkit-font-smoothing: antialiased;
  transition: --ipx-accent 700ms ease, --ipx-aura 700ms ease;
}

.ipx-slider:focus-visible {
  outline: 2px solid var(--ipx-accent);
  outline-offset: -4px;
}

/* ------------------------------------------------------------- atmosphere */

.ipx-aura {
  position: absolute;
  inset: -20%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(46% 40% at 50% 46%, var(--ipx-aura) 0%, transparent 68%),
    radial-gradient(22% 20% at 50% 62%, var(--ipx-accent) 0%, transparent 70%);
  opacity: 0.55;
  filter: blur(28px);
  transition: opacity 600ms ease;
}

.ipx-vignette {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: radial-gradient(80% 60% at 50% 45%, transparent 40%, rgba(18, 10, 6, 0.55) 100%);
}

/* Fine film grain keeps the large flat areas from banding. */
.ipx-vignette::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.16;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.5'/></svg>");
}

.ipx-slider.ipx-pulse .ipx-aura {
  animation: ipx-aura-pulse 1000ms cubic-bezier(0.16, 0.84, 0.32, 1);
}

@keyframes ipx-aura-pulse {
  0% { opacity: 0.55; transform: scale(1); }
  22% { opacity: 0.92; transform: scale(1.045); }
  100% { opacity: 0.55; transform: scale(1); }
}

/* -------------------------------------------------------------- header */

.ipx-head {
  position: relative;
  z-index: 5;
  text-align: center;
}

.ipx-eyebrow {
  display: block;
  font-family: var(--ipx-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ipx-accent-soft);
}

.ipx-hint {
  margin: 8px 0 0;
  font-size: 13px;
  color: var(--ipx-cream-dim);
}

/* --------------------------------------------------------------- stage */

.ipx-stage {
  position: relative;
  z-index: 4;
  flex: 1 1 auto;
  min-height: clamp(280px, 42vh, 420px);
  cursor: grab;
  touch-action: pan-y; /* vertical page scrolling still works */
  user-select: none;
  -webkit-user-select: none;
}

.ipx-slider.ipx-dragging .ipx-stage { cursor: grabbing; }

.ipx-rail {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
}

.ipx-slide {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  /* Sits the bottle low in the stage so the plume has somewhere to go. */
  padding-top: clamp(40px, 9vh, 92px);
  will-change: transform, opacity;
  backface-visibility: hidden;
}

.ipx-bottle { position: relative; }

.ipx-bottle-svg {
  display: block;
  height: var(--ipx-bottle-h);
  width: auto;
  overflow: visible;
  filter: drop-shadow(0 24px 34px rgba(0, 0, 0, 0.55));
  transition: filter 500ms ease;
}

.ipx-slide.ipx-active .ipx-bottle-svg {
  filter:
    drop-shadow(0 24px 34px rgba(0, 0, 0, 0.55))
    drop-shadow(0 0 26px color-mix(in srgb, var(--ipx-accent) 40%, transparent));
}

/* ---------------------------------------------------------- bottle label

   Deliberately HTML rather than SVG <text>: see renderLabel() in bottle.js.
   Position and type size are percentages of the bottle box, so the label
   tracks the glass exactly however the slider is scaled.                    */

.ipx-label {
  position: absolute;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.5%;
  padding: 0 4%;
  border-radius: 4px;
  color: var(--ipx-l-ink);
  background: var(--ipx-l-plate);
  border: 0.5px solid rgba(255, 255, 255, 0.24);
  pointer-events: none;
  overflow: hidden;
}

.ipx-label-foil {
  background-image: linear-gradient(
    135deg,
    rgba(255, 255, 255, 0.42) 0%,
    rgba(255, 255, 255, 0) 42%,
    rgba(0, 0, 0, 0.12) 100%
  );
  border-radius: 3px;
}

.ipx-label-etched { border-radius: 5px; }
.ipx-label-plate { border-radius: 2px; }

.ipx-l-mark {
  font-family: var(--ipx-serif);
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.14em;
  text-indent: 0.14em; /* balances the trailing letter-spacing */
}

.ipx-l-name {
  font-family: var(--ipx-serif);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.ipx-l-rule {
  width: 62%;
  height: 1px;
  background: currentColor;
  opacity: 0.45;
}

.ipx-l-size {
  font-family: var(--ipx-mono);
  line-height: 1;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-indent: 0.12em;
}

/* ---------------------------------------------------------- the atomiser */

.ipx-actuator { transform-origin: 110px 98px; }

.ipx-slide.ipx-firing .ipx-actuator {
  animation: ipx-press 440ms cubic-bezier(0.2, 0.9, 0.25, 1);
}

@keyframes ipx-press {
  0% { transform: translateY(0); }
  14% { transform: translateY(4px); }
  46% { transform: translateY(3.4px); }
  100% { transform: translateY(0); }
}

/* Liquid pulled up the dip tube as the bottle fires. */
.ipx-slide.ipx-firing .ipx-tube-draw {
  animation: ipx-draw 520ms ease-out;
}

@keyframes ipx-draw {
  0% { opacity: 0; }
  18% { opacity: 0.85; }
  62% { opacity: 0.5; }
  100% { opacity: 0; }
}

.ipx-slide.ipx-firing .ipx-juice {
  animation: ipx-slosh 620ms ease-out;
}

@keyframes ipx-slosh {
  0% { transform: translateY(0); }
  22% { transform: translateY(1.6px); }
  60% { transform: translateY(-0.8px); }
  100% { transform: translateY(0); }
}

/* --------------------------------------------------------- spray layers */

.ipx-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 200;
  pointer-events: none;
}

.ipx-notes-layer {
  position: absolute;
  inset: 0;
  z-index: 210;
  pointer-events: none;
  overflow: hidden;
}

.ipx-note-float {
  position: absolute;
  font-family: var(--ipx-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--ipx-accent-soft);
  opacity: 0;
  animation: ipx-note-rise 2600ms cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
}

@keyframes ipx-note-rise {
  0% { opacity: 0; transform: translate(0, 0) scale(0.9); filter: blur(3px); }
  18% { opacity: 0.95; filter: blur(0); }
  100% {
    opacity: 0;
    transform: translate(var(--ipx-note-dx, 58px), var(--ipx-note-dy, -84px)) scale(1.08);
    filter: blur(2px);
  }
}

/* ------------------------------------------------------------ nav arrows */

.ipx-nav {
  position: absolute;
  top: 50%;
  z-index: 300;
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  margin-top: -23px;
  border: 1px solid var(--ipx-line);
  border-radius: 50%;
  background: rgba(246, 236, 220, 0.05);
  backdrop-filter: blur(6px);
  color: var(--ipx-cream);
  cursor: pointer;
  transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
}

.ipx-nav svg { width: 22px; height: 22px; }
.ipx-nav:hover {
  background: rgba(246, 236, 220, 0.12);
  border-color: var(--ipx-accent);
  transform: scale(1.06);
}
.ipx-nav:active { transform: scale(0.96); }
.ipx-prev { left: clamp(2px, 2vw, 24px); }
.ipx-next { right: clamp(2px, 2vw, 24px); }

/* ------------------------------------------------------------------ info */

.ipx-info {
  position: relative;
  z-index: 5;
  text-align: center;
}

.ipx-info-in { animation: ipx-fade-up 560ms cubic-bezier(0.16, 0.84, 0.32, 1); }

@keyframes ipx-fade-up {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.ipx-collection {
  display: block;
  font-family: var(--ipx-mono);
  font-size: 10.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ipx-accent);
}

.ipx-name {
  margin: 8px 0 6px;
  font-family: var(--ipx-serif);
  font-weight: 600;
  font-size: clamp(30px, 5.4vw, 46px);
  line-height: 1.05;
  letter-spacing: -0.01em;
}

.ipx-tagline {
  margin: 0 auto 18px;
  max-width: 46ch;
  font-family: var(--ipx-serif);
  font-style: italic;
  font-size: clamp(14px, 1.6vw, 16.5px);
  line-height: 1.55;
  color: var(--ipx-cream-dim);
}

.ipx-notes {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px 26px;
  margin: 0 0 16px;
}

.ipx-note-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.ipx-note-row dt {
  font-family: var(--ipx-mono);
  font-size: 9.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ipx-accent);
}

.ipx-note-row dd {
  margin: 0;
  font-size: 13px;
  color: var(--ipx-cream-dim);
}

.ipx-meta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 20px;
  font-family: var(--ipx-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ipx-cream-dim);
}

.ipx-dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--ipx-accent);
}

.ipx-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

.ipx-btn {
  font-family: var(--ipx-sans);
  font-weight: 700;
  font-size: 13.5px;
  letter-spacing: 0.02em;
  padding: 12px 26px;
  border-radius: 26px;
  cursor: pointer;
  transition: transform 160ms ease, background 200ms ease, border-color 200ms ease;
}

.ipx-btn:active { transform: scale(0.97); }

.ipx-btn-ghost {
  border: 1.5px solid var(--ipx-line);
  background: transparent;
  color: var(--ipx-cream);
}
.ipx-btn-ghost:hover {
  border-color: var(--ipx-accent);
  background: rgba(246, 236, 220, 0.06);
}

.ipx-btn-solid {
  border: 1.5px solid var(--ipx-accent);
  background: var(--ipx-accent);
  color: #24150d;
}
.ipx-btn-solid:hover { filter: brightness(1.1); }

/* ------------------------------------------------------------- scrub rail */

.ipx-scrub {
  position: relative;
  z-index: 5;
  display: flex;
  justify-content: center;
}

.ipx-track {
  position: relative;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 10px 14px;
  border: 1px solid var(--ipx-line);
  border-radius: 999px;
  background: rgba(20, 12, 8, 0.4);
  backdrop-filter: blur(8px);
}

.ipx-tick {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  padding: 0;
  border: none;
  background: none;
  cursor: pointer;
}

.ipx-tick-line {
  width: 2px;
  height: 12px;
  border-radius: 2px;
  background: rgba(246, 236, 220, 0.3);
  transition: height 260ms cubic-bezier(0.16, 0.84, 0.32, 1), background 260ms ease,
    box-shadow 260ms ease;
}

.ipx-tick:hover .ipx-tick-line { background: rgba(246, 236, 220, 0.6); height: 16px; }

.ipx-tick[aria-selected="true"] .ipx-tick-line {
  height: 20px;
  background: var(--ipx-accent);
  box-shadow: 0 0 10px color-mix(in srgb, var(--ipx-accent) 70%, transparent);
}

/* ------------------------------------------------------------- responsive */

@media (max-width: 720px) {
  .ipx-slider { padding-left: 12px; padding-right: 12px; min-height: 580px; }
  .ipx-nav { width: 38px; height: 38px; margin-top: -19px; }
  .ipx-nav svg { width: 18px; height: 18px; }
  .ipx-notes { flex-direction: column; align-items: center; gap: 4px; }
  .ipx-hint { font-size: 12px; }
}

@media (max-width: 420px) {
  .ipx-nav { display: none; }
}

/* --------------------------------------------------------- reduced motion */

@media (prefers-reduced-motion: reduce) {
  .ipx-slider *,
  .ipx-slider *::before,
  .ipx-slider *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

const { SprayEngine } = (() => {
/**
 * Spray engine.
 *
 * A canvas particle system tuned to behave like an atomiser rather than a
 * generic particle burst. Three things happen at once, and the overlap is what
 * makes it read as perfume rather than smoke:
 *
 *   jet      — a few hundred fast, tiny, bright droplets in a narrow cone.
 *              They carry a long way before drag kills them, which is what
 *              gives the spray its reach and its grain.
 *   mist     — slow, large, very low-alpha puffs that expand and rise. This is
 *              the body of the cloud; it lingers for a couple of seconds.
 *   fallout  — every droplet that dies has a chance of becoming a mist puff,
 *              so the cloud grows outward along the path the jet actually took
 *              instead of sitting in a ball at the nozzle.
 *
 * Everything is drawn additively, so density builds where particles overlap.
 */

const FRAME = 1000 / 60;
const TAU = Math.PI * 2;
const MAX_PARTICLES = 1800;

/** Soft radial sprites, cached per colour + hardness. */
const spriteCache = new Map();

function toRGBA(color, a) {
  if (typeof color === "string" && color.charCodeAt(0) === 35) {
    let hex = color.slice(1);
    if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
    const n = Number.parseInt(hex, 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
  }
  return color;
}

/**
 * @param {string} color
 * @param {'core'|'soft'} kind  `core` is a tight droplet, `soft` is haze.
 */
function sprite(color, kind) {
  const key = `${kind}|${color}`;
  const hit = spriteCache.get(key);
  if (hit) return hit;

  const size = 96;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  const half = size / 2;
  const grad = g.createRadialGradient(half, half, 0, half, half, half);

  if (kind === "core") {
    grad.addColorStop(0, toRGBA(color, 1));
    grad.addColorStop(0.32, toRGBA(color, 0.72));
    grad.addColorStop(1, toRGBA(color, 0));
  } else {
    grad.addColorStop(0, toRGBA(color, 0.42));
    grad.addColorStop(0.32, toRGBA(color, 0.2));
    grad.addColorStop(1, toRGBA(color, 0));
  }

  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  spriteCache.set(key, c);
  return c;
}

const rand = (a, b) => a + Math.random() * (b - a);
/** Triangular distribution — clusters toward the middle of the cone. */
const spread = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;

class SprayEngine {
  /** @param {HTMLCanvasElement} canvas */
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.particles = [];
    this.emitters = [];
    this.flashes = [];
    this.running = false;
    this.last = 0;
    this.dpr = 1;
    this.w = 0;

      angle: e.angle,

      kind: "mist",
      x: e.x + rand(-2, 2),
      y: e.y + rand(-2, 2),
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      r: rand(5, 16),
      grow: rand(1.006, 1.016),
      life: 0,
      max: rand(1300, 2600),
      alpha: rand(0.035, 0.095),
      phase: Math.random() * TAU,
      color: e.color,
    });

  /** A spent droplet hanging in the air as vapour. */
  _fallout(p) {
    this.particles.push({
      kind: "mist",
      x: p.x,
      y: p.y,
      vx: p.vx * 0.3,
      vy: p.vy * 0.3,
      r: rand(3, 9),
      grow: rand(1.008, 1.018),
      life: 0,
      max: rand(900, 1800),
      alpha: rand(0.03, 0.075),

  }

  _loop(now) {
    if (!this.running) return;

    const raw = now - this.last;

    const ms = Math.min(raw, 50);

    this._draw();

      requestAnimationFrame(this._loop);

      this.running = false;

    }
  }

  _step(dt, ms) {

    for (let i = this.emitters.length - 1; i >= 0; i--) {
      const e = this.emitters[i];

      const t = Math.min(e.age / e.life, 1);

        const drops = Math.round(30 * e.power * (1 - 0.65 * t) * dt);
        for (let n = 0; n < drops; n++) this._drop(e);
        const puffs = Math.round(6 * e.power * dt);
        for (let n = 0; n < puffs; n++) this._puff(e);

      if (e.age >= e.life) this.emitters.splice(i, 1);

      this.flashes[i].age += ms;
      if (this.flashes[i].age >= this.flashes[i].life) this.flashes.splice(i, 1);

      const p = this.particles[i];

        if (p.kind === "drop" && Math.random() < 0.62 && this.particles.length < MAX_PARTICLES) {

      const drift = Math.sin(p.life / 240 + p.phase) * 0.06;

      if (p.kind === "drop") {
        const d = Math.pow(0.955, dt);
        p.vx *= d;
        p.vy *= d;
        p.vy += 0.05 * dt; // gravity pulls the heavier droplets down
        p.vx += drift * dt;

      p.y += p.vy * dt;

        const fadeIn = p.kind === "drop" ? 0.06 : 0.16;
        // Droplets fall off harder than mist, so the far edge of the cone
        // dissolves into haze instead of staying a field of bright specks.
        const falloff = p.kind === "drop" ? 1.9 : 1.3;
        const env = t < fadeIn ? t / fadeIn : Math.pow(1 - (t - fadeIn) / (1 - fadeIn), falloff);
        const a = p.alpha * env;
        if (a <= 0.003) continue;

        const d = p.kind === "drop" ? Math.max(1.6, p.r * 2.4) : p.r * 4.6;
        g.globalAlpha = a;
        g.drawImage(sprite(p.color, p.kind === "drop" ? "core" : "soft"), p.x - d / 2, p.y - d / 2, d, d);

      g.globalAlpha = (1 - t) * 0.75;
      const d = 12 + t * 26;

    g.globalCompositeOperation = "source-over";
  }

  }

 * @param {boolean} [options.autoplay]      Advance on a timer. Default false.
 * @param {number} [options.autoplayDelay]  Milliseconds between advances. Default 5200.
 * @param {(perfume, index) => void} [options.onChange]

    perfumes: PERFUMES,
    index: 0,
    sprayOnChange: true,

    autoplayDelay: 5200,
    onChange: null,
    onSpray: null,

  let autoTimer = null;
  function startAutoplay() {
    if (!opts.autoplay || reduced) return;
    stopAutoplay();
    autoTimer = setInterval(() => {
      if (document.hidden) return;
      setIndex(index >= perfumes.length - 1 ? 0 : index + 1);
    }, opts.autoplayDelay);
  }
  function stopAutoplay() {
    clearInterval(autoTimer);
    autoTimer = null;
  }

  /* ----------------------------------------------------------------- wiring */

  stage.addEventListener("pointerdown", onPointerDown);
  stage.addEventListener("pointermove", onPointerMove);
  stage.addEventListener("pointerup", onPointerUp);
  stage.addEventListener("pointercancel", onPointerUp);
  stage.addEventListener("wheel", onWheel, { passive: false });
  root.addEventListener("keydown", onKeyDown);
  root.addEventListener("click", onClick);

  const ro = new ResizeObserver(measure);
  ro.observe(stage);

  const onVisibility = () => document.hidden && engine.stop();
  document.addEventListener("visibilitychange", onVisibility);

  buildSlides();
  setIndex(index, { animate: false, spraying: false });
  measure();
  // Opening spray, once the layout has settled.
  const bootTimer = setTimeout(() => !destroyed && opts.sprayOnChange && spray(index, 1), 520);
  startAutoplay();

  /* -------------------------------------------------------------------- API */

  return {
    get index() {
      return index;
    },
    get perfume() {
      return perfumes[index];
    },
    goTo: (i) => setIndex(i),
    next,
    prev,
    spray: (power = 1) => spray(index, power),
    /** Swap the collection at runtime — e.g. once the API responds. */
    setPerfumes(list, keepIndex = true) {
      perfumes = list.slice();
      index = clamp(keepIndex ? index : 0, 0, perfumes.length - 1);
      buildSlides();
      setIndex(index, { animate: false, spraying: false });
      measure();
    },
    destroy() {
      destroyed = true;
      clearTimeout(bootTimer);
      clearTimeout(firingTimer);
      stopAutoplay();
      if (tween) cancelAnimationFrame(tween.raf);
      ro.disconnect();
      document.removeEventListener("visibilitychange", onVisibility);
      stage.removeEventListener("pointerdown", onPointerDown);
      stage.removeEventListener("pointermove", onPointerMove);
      stage.removeEventListener("pointerup", onPointerUp);
      stage.removeEventListener("pointercancel", onPointerUp);
      stage.removeEventListener("wheel", onWheel);
      root.removeEventListener("keydown", onKeyDown);
      root.removeEventListener("click", onClick);
      engine.destroy();
      root.innerHTML = "";
      root.classList.remove("ipx-slider");
    },
  };
}

return { createPerfumeSlider };
})();

/* ===== mount ===== */
const slider = createPerfumeSlider(document.getElementById("collection"), {
  perfumes: PERFUMES,
  index: 0,
  onSelect(perfume) {
    // Integration point — in the Next app this navigates to the product page.
    console.log("selected", perfume.id, perfume.name);
  },
});

// Handy while tuning: window.slider.spray(), .next(), .goTo(3)
window.slider = slider;
</script>
